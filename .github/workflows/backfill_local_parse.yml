name: Hyperpure local-parse backfill (one-off)

# Re-reads every LlamaExtract-loaded Hyperpure GRN since `since` from its PDF and replaces the rows where
# LlamaExtract got it wrong (backfill_local_parse.py). Manual only. No LlamaExtract calls.
on:
  workflow_dispatch:
    inputs:
      since:
        description: 'GRN date from (YYYY-MM-DD)'
        default: '2026-03-25'
      apply:
        description: 'Write the corrections (false = dry run)'
        type: boolean
        default: true

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Restore Google credentials
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          GOOGLE_TOKEN: ${{ secrets.GOOGLE_TOKEN }}
        run: |
          echo "$GOOGLE_CREDENTIALS" | base64 -d > credentials.json
          echo "$GOOGLE_TOKEN" | base64 -d > token.json
      - name: Backfill
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python -u backfill_local_parse.py --since "${{ inputs.since }}" --budget-minutes 220 ${{ inputs.apply && '--apply' || '' }}
      - name: Keep the replaced rows
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backfill-backup
          path: backfill_backup.jsonl
          if-no-files-found: ignore
          retention-days: 90
      - name: Remove credentials
        if: always()
        run: rm -f credentials.json token.json
